name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify tag and version
        shell: bash
        env:
          CODEX_EXPORT_UPDATE_PUBLIC_KEY: ${{ vars.CODEX_EXPORT_UPDATE_PUBLIC_KEY }}
          CODEX_EXPORT_UPDATE_PRIVATE_KEY: ${{ secrets.CODEX_EXPORT_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source scripts/version.sh
          load_project_version VERSION
          test "${GITHUB_REF_NAME}" = "v${MARKETING_VERSION}"
          test -n "${CODEX_EXPORT_UPDATE_PUBLIC_KEY}"
          test -n "${CODEX_EXPORT_UPDATE_PRIVATE_KEY}"

      - name: Test
        run: >-
          swift test
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Build signed update assets
        shell: bash
        env:
          CODEX_EXPORT_UPDATE_REPOSITORY: ${{ github.repository }}
          CODEX_EXPORT_UPDATE_PUBLIC_KEY: ${{ vars.CODEX_EXPORT_UPDATE_PUBLIC_KEY }}
          CODEX_EXPORT_UPDATE_PRIVATE_KEY: ${{ secrets.CODEX_EXPORT_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          OUTPUT_ROOT="${RUNNER_TEMP}/CodexExportRelease" ./scripts/package-release.sh

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/CodexExportRelease"
          version="${GITHUB_REF_NAME#v}"
          created=0
          cleanup() {
            status=$?
            trap - EXIT
            if [[ "$created" -eq 1 ]]; then
              gh release delete "${GITHUB_REF_NAME}" --yes || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          gh release create "${GITHUB_REF_NAME}" \
            "${root}/Codex-Export-${version}.zip" \
            "${root}/Codex-Export-update.json" \
            "${root}/Codex-Export-update.sig" \
            --draft \
            --verify-tag \
            --title "Codex Export ${GITHUB_REF_NAME#v}" \
            --generate-notes
          created=1

          actual_assets="$(gh release view "${GITHUB_REF_NAME}" \
            --json assets \
            --jq '.assets[].name' \
            | LC_ALL=C sort)"
          expected_assets="$(printf '%s\n' \
            "Codex-Export-${version}.zip" \
            "Codex-Export-update.json" \
            "Codex-Export-update.sig" \
            | LC_ALL=C sort)"
          test "$actual_assets" = "$expected_assets"

          gh release edit "${GITHUB_REF_NAME}" --draft=false
          created=0
